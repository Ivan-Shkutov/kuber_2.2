apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location / {
          root /usr/share/nginx/html;
          index index.html;
        }
      }
    }

  index.html: |
    <html>
    <head><title>K8s Test</title></head>
    <body>
      <h1>Hello from Kubernetes!</h1>
      <p>ConfigMap works!</p>
    </body>
    </html>
